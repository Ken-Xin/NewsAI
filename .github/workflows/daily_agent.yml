name: Daily News Agent

on:
  schedule:
    # 日本時間 朝7:00 に自動実行（UTC 22:00）
    - cron: '0 22 * * *'
  # GitHubの画面から手動で実行ボタン（Run workflow）を押せるようにする設定
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードをGitHub Actionsの仮想環境にチェックアウト（取得）
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Python環境のセットアップ（バージョン指定）
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. main.py が依存しているライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai requests

      # 4. Secretsから環境変数を読み込んで main.py を実行
      - name: Run main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
